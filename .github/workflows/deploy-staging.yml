name: Deploy staging environment

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          # `@awesomely-group/giro-contracts` vive en GitHub Packages.
          registry-url: https://npm.pkg.github.com
          scope: "@awesomely-group"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Lo lee `.npmrc`. El token del propio job basta si el paquete da acceso a
          # este repositorio desde sus ajustes en la organización.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build project
        run: pnpm next build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}

      - name: Trigger Vercel staging deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL_STAGING }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Missing VERCEL_DEPLOY_HOOK_URL_STAGING secret."
            echo "Add a Vercel Staging Deploy Hook URL in repository secrets to enable auto deployment from this workflow."
            exit 1
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
