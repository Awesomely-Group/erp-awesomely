name: Deploy staging

# Despliega una rama cualquiera en https://erp-staging.awesomelygroup.com para probar
# cambios y migraciones contra una copia de los datos reales antes de que lleguen a
# producción. Ver docs/staging.md.
#
# Cómo está montado: el proyecto Vercel `erp-awesomely` está conectado por Git y tiene
# ese dominio asignado a la rama `staging`, así que "desplegar en staging" es poner la
# rama `staging` en el commit elegido. Vercel construye con las variables de Preview, que
# apuntan a la rama `staging` de Neon. Este workflow hace antes lo que Vercel no hace:
# lint, typecheck, tests y `prisma migrate deploy` contra esa base.
#
# Dos formas de lanzarlo:
# - A mano (Actions → Deploy staging → Run workflow → rama o commit): comprueba, migra y
#   mueve la rama `staging` al commit elegido. Es la forma normal.
# - Por push directo a `staging`: Vercel ya está desplegando; aquí solo se comprueba y se
#   migra. El deploy de Vercel puede terminar antes que la migración; en staging es
#   tolerable, y el siguiente refresco nocturno vuelve a dejarlo cuadrado.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama o commit a desplegar en staging"
        required: true
        default: main
  push:
    branches:
      - staging

# Dos despliegues a la vez migrarían la misma base en paralelo.
concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # Sin `ref`: la guarda se lee del commit donde vive este workflow, no del que se va a
      # desplegar, que puede ser una rama antigua sin el script.
      - uses: actions/checkout@v4

      - name: Comprobar que staging no es producción
        env:
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          STAGING_DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: bash .github/scripts/check-staging-db.sh

  build:
    needs: guard
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: Build
        run: pnpm next build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}

  migrate:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - name: Migrar la rama staging de Neon
        run: pnpm prisma migrate deploy
        env:
          # Endpoint directo, no pooled: mismo motivo que en deploy.yml (advisory locks
          # de Prisma y PgBouncer en modo transacción).
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

  publish:
    # Solo cuando se lanza a mano: en un push a `staging` la rama ya está donde tiene que
    # estar. El push con GITHUB_TOKEN no vuelve a disparar este workflow (GitHub lo evita
    # a propósito), pero sí llega a Vercel, que es quien despliega.
    if: github.event_name == 'workflow_dispatch'
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Mover la rama staging al commit elegido
        run: |
          echo "staging <- $(git rev-parse --short HEAD) (${{ inputs.ref }})"
          git push --force origin HEAD:refs/heads/staging
