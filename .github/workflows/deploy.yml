name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Base de usar y tirar para comprobar que las migraciones reconstruyen el esquema.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deriva
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # El historial de migraciones se desincronizó del esquema durante meses porque
      # `migrate deploy` solo aplica lo pendiente: nunca comprueba que el resultado sea
      # el esquema. Esto levanta un Postgres vacío, aplica la cadena entera y exige que
      # no quede diferencia. Si alguien vuelve a cambiar el esquema con `db push` en vez
      # de con una migración, falla aquí y no dos meses después, cuando alguien levante
      # un entorno nuevo.
      - name: Las migraciones reconstruyen el esquema
        run: |
          pnpm prisma migrate deploy
          pnpm prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deriva

      - name: Build project
        run: pnpm next build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  migrate:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run database migrations
        run: pnpm prisma migrate deploy
        env:
          # Endpoint directo (no pooled) de Neon: los advisory locks de Prisma
          # son de sesión y PgBouncer (modo transacción) puede reciclar la
          # conexión física del pool sin liberar el lock, dejando un lock
          # zombi que bloquea este job (visto en el merge del PR #4, P1002).
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Trigger Vercel production deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          HOOK_URL=$(echo "$VERCEL_DEPLOY_HOOK_URL" | tr -d '[:space:]')
          if [ -z "$HOOK_URL" ]; then
            echo "Missing VERCEL_DEPLOY_HOOK_URL secret."
            exit 1
          fi
          curl -fsS -X POST "$HOOK_URL"
